<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420">
  <defs>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#321052"/>
      <stop offset=".28" stop-color="#7626bd"/>
      <stop offset=".58" stop-color="#c17aff"/>
      <stop offset=".82" stop-color="#7626bd"/>
      <stop offset="1" stop-color="#260b42"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#555b68"/>
      <stop offset=".22" stop-color="#aeb3bf"/>
      <stop offset=".5" stop-color="#f0f1f5"/>
      <stop offset=".76" stop-color="#969ca9"/>
      <stop offset="1" stop-color="#555b68"/>
    </linearGradient>
    <linearGradient id="darkMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24202d"/>
      <stop offset=".5" stop-color="#0d0b13"/>
      <stop offset="1" stop-color="#30203e"/>
    </linearGradient>
    <filter id="violetGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0.7 0 0 0 0.35  0 0.25 0 0 0.05  0 0 1 0 0.8  0 0 0 0.85 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="silverGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="shell">
      <path d="M76 104 Q103 83 151 77 L190 91 Q211 76 260 76 Q309 76 330 91 L369 77 Q417 83 444 104 Q468 149 478 229 Q486 302 452 335 Q428 359 404 341 L349 289 Q329 271 306 271 H214 Q191 271 171 289 L116 341 Q92 359 68 335 Q34 302 42 229 Q52 149 76 104Z"/>
    </clipPath>
    <g id="grip-art" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Main flame / claw motif -->
      <g stroke="url(#violet)" stroke-width="6" filter="url(#violetGlow)">
        <path d="M47 205 Q71 177 98 182 Q119 185 130 204 Q139 222 125 240 Q112 257 91 246 Q77 239 82 224 Q87 211 101 216"/>
        <path d="M50 252 Q77 251 96 270 Q113 287 101 308 Q91 325 72 314"/>
        <path d="M69 160 Q92 133 123 143 Q151 152 153 178 Q154 198 137 207"/>
        <path d="M89 328 Q119 326 143 302 Q160 284 177 290"/>
        <path d="M112 113 Q143 125 160 151 L174 177 L194 183"/>
        <path d="M59 282 L81 291 L98 312 L117 320"/>
      </g>
      <!-- Inner blade lines -->
      <g stroke="#d4a6ff" stroke-width="2.1" opacity=".88" filter="url(#silverGlow)">
        <path d="M57 199 Q83 180 104 191 Q119 199 122 215"/>
        <path d="M88 225 Q98 211 112 224 Q119 234 108 243"/>
        <path d="M60 260 Q86 265 101 285"/>
        <path d="M79 169 Q102 148 125 157 Q139 163 143 180"/>
        <path d="M102 321 Q130 314 151 291"/>
        <path d="M125 122 Q150 139 165 166"/>
      </g>
      <!-- Sharp silver cuts -->
      <g stroke="url(#silver)" stroke-width="2.6" opacity=".9">
        <path d="M43 185 L67 166 L83 144"/>
        <path d="M45 230 L67 219 L76 205"/>
        <path d="M54 300 L79 309 L92 330"/>
        <path d="M108 105 L143 119 L158 137"/>
        <path d="M143 337 L166 316 L186 298"/>
      </g>
      <!-- Micro circuit / etched detail -->
      <g stroke="url(#violet)" stroke-width="2.2" opacity=".95">
        <path d="M52 143 L72 132 L88 132 L99 120"/>
        <path d="M48 155 L63 147 L75 147"/>
        <path d="M54 322 L69 331 L82 331 L93 342"/>
        <path d="M119 349 L137 334 L147 334"/>
        <path d="M164 105 L178 116 L187 132"/>
      </g>
      <g fill="#c58bff" opacity=".9">
        <circle cx="72" cy="132" r="2.2"/>
        <circle cx="63" cy="147" r="1.8"/>
        <circle cx="82" cy="331" r="2"/>
        <circle cx="147" cy="334" r="2"/>
        <circle cx="178" cy="116" r="2"/>
      </g>
    </g>
  </defs>

  <g clip-path="url(#shell)">
    <!-- Symmetrical grip engravings -->
    <use href="#grip-art"/>
    <use href="#grip-art" transform="translate(520 0) scale(-1 1)"/>

    <!-- Long silver chassis pinstripes -->
    <g fill="none" stroke="url(#silver)" stroke-width="2.4" opacity=".84" stroke-linecap="round">
      <path d="M62 112 Q104 80 157 88 L191 103"/>
      <path d="M458 112 Q416 80 363 88 L329 103"/>
      <path d="M53 225 Q58 168 84 127"/>
      <path d="M467 225 Q462 168 436 127"/>
      <path d="M87 340 Q111 354 134 333 L178 292"/>
      <path d="M433 340 Q409 354 386 333 L342 292"/>
      <path d="M178 92 L195 108 L211 112"/>
      <path d="M342 92 L325 108 L309 112"/>
    </g>

    <!-- Secondary violet energy channels -->
    <g fill="none" stroke="url(#violet)" stroke-width="3" opacity=".9" filter="url(#violetGlow)" stroke-linecap="round">
      <path d="M68 119 Q112 91 158 100 L184 115"/>
      <path d="M452 119 Q408 91 362 100 L336 115"/>
      <path d="M47 267 Q55 310 83 329"/>
      <path d="M473 267 Q465 310 437 329"/>
      <path d="M145 350 L176 320 L194 302"/>
      <path d="M375 350 L344 320 L326 302"/>
    </g>

    <!-- Fine technical engraving around the bridge -->
    <g fill="none" stroke="url(#silver)" stroke-width="1.4" opacity=".72">
      <path d="M203 91 L216 101 L230 101"/>
      <path d="M317 91 L304 101 L290 101"/>
      <path d="M197 286 L215 278 L233 278"/>
      <path d="M323 286 L305 278 L287 278"/>
      <path d="M188 307 L205 298 L219 298"/>
      <path d="M332 307 L315 298 L301 298"/>
    </g>
  </g>

  <!-- Center FireSaints crest: metallic shield, violet core, FS monogram -->
  <g transform="translate(260 307)">
    <path d="M-43 -14 L-23 -26 L0 -18 L23 -26 L43 -14 L34 10 L0 29 L-34 10Z"
          fill="url(#darkMetal)" stroke="url(#silver)" stroke-width="2"/>
    <path d="M-30 -12 L-15 -20 L0 -14 L15 -20 L30 -12 L24 7 L0 20 L-24 7Z"
          fill="none" stroke="url(#violet)" stroke-width="2.2" filter="url(#violetGlow)"/>
    <path d="M-17 -7 L-5 -15 L7 -10 L18 -15" fill="none" stroke="#d9c4f5" stroke-width="1.4" opacity=".9"/>
    <text x="0" y="6" text-anchor="middle" font-family="Arial Black,Arial,sans-serif"
          font-size="20" font-weight="900" letter-spacing="-1.5" fill="#eee5fa">FS</text>
    <path d="M-52 0 L-43 0 M43 0 L52 0" stroke="url(#silver)" stroke-width="1.6"/>
  </g>
</svg>
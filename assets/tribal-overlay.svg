<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420">
<defs>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#230638"/><stop offset=".24" stop-color="#6d19b7"/><stop offset=".52" stop-color="#c77aff"/><stop offset=".76" stop-color="#7a20c8"/><stop offset="1" stop-color="#210532"/></linearGradient>
 <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#51545f"/><stop offset=".22" stop-color="#f1f1f5"/><stop offset=".43" stop-color="#858995"/><stop offset=".68" stop-color="#e4e5eb"/><stop offset="1" stop-color="#424650"/></linearGradient>
 <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#292632"/><stop offset=".45" stop-color="#09080d"/><stop offset="1" stop-color="#292331"/></linearGradient>
 <filter id="purpleGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
